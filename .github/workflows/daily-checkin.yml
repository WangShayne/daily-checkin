name: Daily Check-in

on:
  schedule:
    # 01:00 UTC ≈ 09:00 Asia/Shanghai
    - cron: "0 1 * * *"
  workflow_dispatch:

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Write config from secret (optional)
        env:
          CHECKIN_CONFIG_YAML: ${{ secrets.CHECKIN_CONFIG_YAML }}
        run: |
          if [ -n "$CHECKIN_CONFIG_YAML" ]; then
            printf '%s\n' "$CHECKIN_CONFIG_YAML" > config.yaml
            echo "Wrote config.yaml from CHECKIN_CONFIG_YAML secret"
          elif [ -f config.example.yaml ]; then
            cp config.example.yaml config.yaml
            echo "Using config.example.yaml (enable sites + set secrets for real runs)"
          else
            echo "No config available" >&2
            exit 1
          fi

      - name: Run check-in
        env:
          # Map GitHub Secrets to the env vars referenced in config (${...})
          FORUM_DEMO_COOKIE: ${{ secrets.FORUM_DEMO_COOKIE }}
          PORTAL_DEMO_TOKEN: ${{ secrets.PORTAL_DEMO_TOKEN }}
          HTTP_FORM_DEMO_COOKIE: ${{ secrets.HTTP_FORM_DEMO_COOKIE }}
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
          CHECKIN_CONFIG: config.yaml
        run: python -m checkin --config config.yaml -v
