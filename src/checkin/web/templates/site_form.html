{% extends "base.html" %}
{% block title %}{{ title }} — 每日自动签到{% endblock %}
{% block content %}
<section class="toolbar">
  <h1>{{ title }}</h1>
  <a class="btn" href="/">← 返回</a>
</section>

<form class="card form" method="post"
      action="{% if site %}{{ '/sites/' ~ site.id }}{% else %}/sites{% endif %}">
  <div class="grid-2">
    <label>站点名称 *
      <input name="name" required value="{{ site.name if site else '' }}" placeholder="例如：我的论坛">
    </label>
    <label>启用
      <select name="enabled">
        <option value="1" {% if not site or site.enabled %}selected{% endif %}>启用</option>
        <option value="0" {% if site and not site.enabled %}selected{% endif %}>禁用</option>
      </select>
    </label>
  </div>

  <div class="grid-2">
    <label>站点类型 *
      <select name="type" required>
        {% for t in site_types %}
        <option value="{{ t }}" {% if site and site.type == t %}selected{% endif %}>
          {{ type_labels.get(t, t) }} ({{ t }})
        </option>
        {% endfor %}
      </select>
    </label>
    <label>签到方式 *
      <select name="mode" required>
        <option value="visit" {% if site and site.mode == 'visit' %}selected{% endif %}>
          仅访问 — 每天打开页面即可
        </option>
        <option value="click" {% if not site or site.mode == 'click' %}selected{% endif %}>
          点击/提交 — POST 表单 / API / 按钮
        </option>
        <option value="recorded" {% if site and site.mode == 'recorded' %}selected{% endif %}>
          录制回放 — 使用「录制」页保存的浏览器流程
        </option>
      </select>
    </label>
  </div>

  <div class="grid-2">
    <label>基础 URL *
      <input name="base_url" required value="{{ site.base_url if site else '' }}"
             placeholder="https://example.com">
    </label>
    <label>路径（签到页 / 接口）
      <input name="checkin_path" value="{{ site.checkin_path if site else '' }}"
             placeholder="/plugin.php?id=sign 或留空表示首页">
    </label>
  </div>

  <div class="grid-2">
    <label>HTTP 方法（click 模式）
      <select name="method">
        {% set m = site.method if site else 'POST' %}
        {% for method in ['POST', 'GET', 'PUT'] %}
        <option value="{{ method }}" {% if m == method %}selected{% endif %}>{{ method }}</option>
        {% endfor %}
      </select>
    </label>
    <label>Cookies（登录态，勿泄露）
      <input name="cookies" value="{{ site.cookies if site and site.cookies else '' }}"
             placeholder="sid=xxx; token=yyy">
    </label>
  </div>

  <label>请求头 JSON（可选）
    <textarea name="headers_json" rows="2"
              placeholder='{"User-Agent":"Mozilla/5.0","Authorization":"Bearer ..."}'>{% if site and site.headers %}{{ site.headers | tojson }}{% endif %}</textarea>
  </label>

  <div class="grid-2">
    <label>表单数据 JSON（click）
      <textarea name="form_data_json" rows="2"
                placeholder='{"operation":"qiandao"}'>{% if site and site.form_data %}{{ site.form_data | tojson }}{% endif %}</textarea>
    </label>
    <label>JSON Body（portal click）
      <textarea name="body_json" rows="2"
                placeholder='{"action":"daily"}'>{% if site and site.body %}{{ site.body | tojson }}{% endif %}</textarea>
    </label>
  </div>

  <div class="grid-2">
    <label>成功关键字（逗号分隔）
      <input name="success_keywords"
             value="{% if site %}{{ site.success_keywords | join(', ') }}{% endif %}"
             placeholder="签到成功, 已签到, ok">
    </label>
    <label>成功 HTTP 状态码 JSON
      <input name="success_status"
             value="{% if site %}{{ site.success_status | tojson }}{% else %}[200]{% endif %}">
    </label>
  </div>

  <fieldset>
    <legend>定时计划（Asia/Shanghai）</legend>
    <div class="grid-3">
      <label>计划类型
        <select name="schedule_type" id="schedule_type">
          <option value="daily" {% if not site or site.schedule_type == 'daily' %}selected{% endif %}>每天固定时间</option>
          <option value="cron" {% if site and site.schedule_type == 'cron' %}selected{% endif %}>Cron 表达式</option>
        </select>
      </label>
      <label>每天时间（HH:MM）
        <input name="daily_time" value="{{ site.daily_time if site else '09:00' }}" placeholder="09:00">
      </label>
      <label>Cron（分 时 日 月 周）
        <input name="cron" value="{{ site.cron if site else '0 9 * * *' }}" placeholder="0 9 * * *">
      </label>
    </div>
  </fieldset>

  <div class="form-actions">
    <button class="btn primary" type="submit">保存</button>
    <a class="btn" href="/">取消</a>
  </div>
</form>
{% endblock %}
