{% extends "base.html" %}
{% block title %}设置 — 每日自动签到{% endblock %}
{% block content %}
<section class="toolbar">
  <h1>全局设置</h1>
  <a class="btn" href="/">← 返回</a>
</section>

<form class="card form" method="post" action="/settings">
  <div class="grid-2">
    <label>请求超时（秒）
      <input type="number" name="timeout" min="5" max="300" value="{{ settings.timeout }}">
    </label>
    <label>站点间隔（秒）
      <input type="number" step="0.5" name="delay_between_sites" min="0" value="{{ settings.delay_between_sites }}">
    </label>
  </div>
  <label class="check">
    <input type="checkbox" name="continue_on_error" value="1"
           {% if settings.continue_on_error %}checked{% endif %}>
    失败时继续签到其他站点
  </label>
  <label class="check">
    <input type="checkbox" name="notify_enabled" value="1"
           {% if settings.notify_enabled %}checked{% endif %}>
    启用 Webhook 通知
  </label>
  <label>Webhook URL
    <input name="notify_webhook_url" value="{{ settings.notify_webhook_url }}"
           placeholder="https://hooks.slack.com/... 或 Discord Webhook">
  </label>
  <div class="form-actions">
    <button class="btn primary" type="submit">保存设置</button>
  </div>
</form>
{% endblock %}
