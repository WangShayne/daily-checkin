<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}每日自动签到{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <a href="/">🗓️ 每日自动签到</a>
      <span class="muted">v{{ version | default('') }}</span>
    </div>
    <nav>
      <a href="/">站点</a>
      <a href="/sites/new">添加</a>
      <a href="/logs">日志</a>
      <a href="/settings">设置</a>
    </nav>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <footer class="footer">
    <span>时区：Asia/Shanghai · Docker 部署 · 请勿提交 Cookie / Token</span>
  </footer>
</body>
</html>
