# 复制为 config.yaml 后按需修改（CLI 用）。Docker Web UI 请在网页中添加站点。
# 敏感值请用环境变量，勿写入真实凭证。
# 环境变量占位：${VAR_NAME} 会在加载时从环境 / .env 替换。

settings:
  timeout: 30
  delay_between_sites: 2
  continue_on_error: true

notification:
  enabled: false
  webhook_url: "${NOTIFY_WEBHOOK_URL}"

sites:
  # 仅访问：每天 GET 页面即可
  - name: "示例访问签到"
    type: portal
    mode: visit
    enabled: true
    base_url: "https://portal.example.com"
    checkin_path: "/"
    method: GET
    headers:
      User-Agent: "Mozilla/5.0 (compatible; DailyCheckin/0.2)"
    cookies: "${PORTAL_DEMO_TOKEN}"
    schedule_type: daily
    daily_time: "09:00"

  # 论坛点击签到
  - name: "示例论坛"
    type: forum
    mode: click
    enabled: true
    base_url: "https://forum.example.com"
    checkin_path: "/plugin.php?id=k_misign:sign"
    method: POST
    headers:
      User-Agent: "Mozilla/5.0 (compatible; DailyCheckin/0.2)"
      Referer: "https://forum.example.com/"
    cookies: "${FORUM_DEMO_COOKIE}"
    success_keywords: ["签到成功", "已签到", "success"]
    schedule_type: daily
    daily_time: "09:05"

  # 门户 API 点击签到
  - name: "示例门户 API"
    type: portal
    mode: click
    enabled: true
    base_url: "https://portal.example.com"
    checkin_path: "/api/user/checkin"
    method: POST
    headers:
      Authorization: "Bearer ${PORTAL_DEMO_TOKEN}"
      Content-Type: "application/json"
    body:
      action: "daily"
    success_keywords: ["ok", "success", "已签到"]

  # 通用 HTTP 表单
  - name: "示例表单站点"
    type: http_form
    mode: click
    enabled: false
    base_url: "https://site.example.com"
    checkin_path: "/user/signin"
    method: POST
    form_data:
      do: "checkin"
    cookies: "${HTTP_FORM_DEMO_COOKIE}"
    success_status: [200, 302]
    success_keywords: ["签到成功"]
