[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "daily-checkin"
version = "0.2.0"
description = "Multi-site daily auto check-in with Docker web UI (visit / click modes)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Shayne Wang" }]
dependencies = [
    "requests>=2.31",
    "PyYAML>=6.0",
    "click>=8.1",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "apscheduler>=3.10",
    "itsdangerous>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
checkin = "checkin.cli:main"
checkin-web = "checkin.web.app:create_app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
checkin = ["web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
